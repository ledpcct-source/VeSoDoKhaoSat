name: Deploy iOS to Apple TestFlight

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Marketing Version (e.g. 1.0.3)'
        required: false
        default: '1.0.3'
  push:
    branches:
      - master
      - main

jobs:
  build-and-deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      # 1. Checkout source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Java 17 for Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Setup Xcode
      - name: Set up Xcode
        run: |
          ls -la /Applications | grep -i xcode || true
          if [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.2.app
          elif [ -d "/Applications/Xcode_26.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.1.app
          elif [ -d "/Applications/Xcode_26.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.app
          elif [ -d "/Applications/Xcode_26.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.app
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          xcrun simctl list runtimes || true

      # 4. Cache Gradle & Kotlin Native dependencies
      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 5. Install Apple Certificate (.p12) and Provisioning Profile
      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 || secrets.APPLE_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'github-actions-temp-pwd' }}
          PROFILE_NAME: ${{ secrets.APPLE_PROVISIONING_PROFILE_NAME || 'VeSoDo AppStore Profile' }}
        run: |
          # Tao keychain tam thoi tren runner
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Giai ma va import Certificate (.p12) bang Python
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          python3 -c "import os, sys, base64; open(sys.argv[1], 'wb').write(base64.b64decode(os.environ['BUILD_CERTIFICATE_BASE64'].strip()))" "$CERT_PATH"
          ls -la "$CERT_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Giai ma va cai dat Provisioning Profile
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          RAW_PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          python3 -c "import os, sys, base64; open(sys.argv[1], 'wb').write(base64.b64decode(os.environ['BUILD_PROVISION_PROFILE_BASE64'].strip()))" "$RAW_PROFILE"
          ls -la "$RAW_PROFILE"

          if [ ! -s "$RAW_PROFILE" ]; then
            echo "ERROR: Provisioning profile is empty!"
            exit 1
          fi

          # Trich xuat UUID va cai vao dung thu muc ma Xcode 16 yeu cau
          security cms -D -i "$RAW_PROFILE" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist" || echo "4e14ff80-3574-4f7e-8ae1-a878c2798b3a")
          echo "Provisioning Profile UUID: $UUID"
          cp "$RAW_PROFILE" "$PROFILES_DIR/$UUID.mobileprovision"
          cp "$RAW_PROFILE" "$PROFILES_DIR/build.mobileprovision"
          ls -la "$PROFILES_DIR"

      # 6. Build Kotlin Multiplatform Framework
      - name: Build Compose Multiplatform iOS Framework
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6144M -XX:+UseG1GC"
        run: |
          chmod +x gradlew
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64 --no-daemon -Dorg.gradle.jvmargs="-Xmx6144M -XX:+UseG1GC"

      # 7. Update Version & Build Number
      - name: Configure App Version & Build Number
        env:
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="${INPUT_VERSION:-1.0.3}"
          echo "Setting Marketing Version to: $VERSION"
          echo "Setting Build Number to: $BUILD_NUMBER"
          cd iosApp
          xcrun agvtool new-version -all "$BUILD_NUMBER" || true
          xcrun agvtool new-marketing-version "$VERSION" || true
          cd ..

      # 8. Build Xcode Archive
      - name: Build Xcode Archive (.xcarchive)
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/iosApp.xcarchive \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.APPLE_PROVISIONING_PROFILE_NAME || 'VeSoDo AppStore Profile' }}"

      # 8.5 Inject App Icons into xcarchive before export
      - name: Inject Standalone App Icons
        run: |
          APP_DIR="build/iosApp.xcarchive/Products/Applications/iosApp.app"
          echo "Injecting standalone App Icons into bundle..."
          cp -f iosApp/iosApp/AppIcons/*.png "$APP_DIR/" || true
          ls -la "$APP_DIR" | grep -i "AppIcon" || true

      # 9. Export IPA
      - name: Export .ipa Package
        run: |
          mkdir -p build/ipa
          cat <<EOF > build/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>uploadSymbols</key>
              <true/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${{ secrets.APPLE_BUNDLE_ID || 'com.vesodo.khaosat' }}</key>
                  <string>${{ secrets.APPLE_PROVISIONING_PROFILE_NAME || 'VeSoDo AppStore Profile' }}</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/iosApp.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist build/ExportOptions.plist

      # 10. Verify IPA Signature and Entitlements
      - name: Verify IPA Signature and Entitlements
        run: |
          echo "=== Verifying IPA structure and code signing ==="
          unzip -q build/ipa/iosApp.ipa -d verify_ipa
          echo "--- Embedded Mobileprovision Entitlements ---"
          security cms -D -i "verify_ipa/Payload/iosApp.app/embedded.mobileprovision" | /usr/libexec/PlistBuddy -c "Print :Entitlements" /dev/stdin || true
          echo "--- Binary Code Signature Entitlements ---"
          codesign -d --entitlements :- "verify_ipa/Payload/iosApp.app" || true
          echo "--- Strict Codesign Verification ---"
          codesign -vvv --deep --strict "verify_ipa/Payload/iosApp.app"
          rm -rf verify_ipa

      # 11. Upload to Apple TestFlight
      - name: Upload to Apple TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          echo "Installing App Store Connect API Key..."
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          mkdir -p "$HOME/.private_keys"
          python3 -c "import os, sys; open(sys.argv[1], 'w').write(os.environ['PRIVATE_KEY'].strip() + '\n')" "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          cp "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" "$HOME/.private_keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" "$HOME/.private_keys/AuthKey_${KEY_ID}.p8"

          echo "Validating IPA package with Apple App Store Connect..."
          xcrun altool --validate-app -f build/ipa/iosApp.ipa -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" --show-progress

          echo "Uploading IPA package to TestFlight..."
          xcrun altool --upload-app -f build/ipa/iosApp.ipa -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" --show-progress
